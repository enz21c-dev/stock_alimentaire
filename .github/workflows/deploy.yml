# Teste puis publie la version légère (dossier lite/, compatible iPad iOS 12)
# sur GitHub Pages à chaque envoi sur « main ».
name: Publier l'appli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de la logique
        run: node --test lite/test/logic.test.js
      - name: Préparation du site
        run: |
          mkdir site
          cp -r lite/. site/
          rm -rf site/test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
